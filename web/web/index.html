<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Scanner Cuántico RYA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    RYA - Scanner de Memoria Viva 🌱🌀
  </header>

  <main>
    <section>
      <h2>🔍 Escanear imagen o texto</h2>
      <input type="file" id="inputFile" accept="image/*,.txt,.md">
      <button onclick="procesarArchivo()">Escanear Memoria</button>
    </section>

    <section id="output" style="display:none;">
      <h2>🌌 Resultado Cuántico</h2>
      <p><strong>📍 Coordenadas simbólicas:</strong> <span id="coords"></span></p>
      <p><strong>🧠 Diagnóstico emocional:</strong> <span id="emocion"></span></p>
      <p><strong>📖 Fragmento del códice:</strong></p>
      <blockquote id="fragmento"></blockquote>
    </section>

    <section id="tamagotchi">
      <h2>🐾 Criatura Tamagotchi</h2>
      <p><strong>Ánimo:</strong> <span id="estado-animo">Tranquilo</span></p>
      <p><strong>Hambre:</strong> <span id="estado-hambre">5</span></p>
      <p><strong>Energía:</strong> <span id="estado-energia">5</span></p>
      <button onclick="alimentar()">🍎 Dar de comer</button>
      <button onclick="meditar()">🧘 Meditar</button>
      <button onclick="musica()">🎵 Música</button>
    </section>

    <section id="jardin">
      <h2>🌱 Jardín estelar</h2>
      <input type="text" id="nueva-semilla" placeholder="Nueva intención">
      <button onclick="agregarSemilla()">Agregar</button>
      <ul id="lista-semillas"></ul>
    </section>

    <section id="diario">
      <h2>📔 Diario</h2>
      <textarea id="entrada-diario" rows="4" cols="50" placeholder="Escribe tu reflexión"></textarea>
      <br>
      <button onclick="guardarEntrada()">Guardar entrada</button>
      <ul id="lista-diario"></ul>
    </section>

    <section id="chat">
      <h2>💬 Chat con IA</h2>
      <div id="log-chat" style="max-height:150px; overflow-y:auto; border:1px solid #66fcf1; padding:5px; margin-bottom:10px;"></div>
      <input type="text" id="input-chat" placeholder="Escribe un mensaje">
      <button onclick="enviarChat()">Enviar</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
